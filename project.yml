name: BlinkLive
options:
  bundleIdPrefix: de.ammann
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BlinkLive:
    type: application
    platform: iOS
    sources:
      - BlinkLive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.ammann.apps.blinklive
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: BlinkLive
  BlinkLiveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BlinkLiveTests
    dependencies:
      - target: BlinkLive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.ammann.apps.blinkliveTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BlinkLive:
    build:
      targets:
        BlinkLive: all
        BlinkLiveTests: [test]
    test:
      targets:
        - BlinkLiveTests
